<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TR-102 Training Report</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <div class="bg-blue-700 text-white p-6 rounded-lg shadow-lg text-center">
      <h1 class="text-3xl font-bold">TR-102 Training Report</h1>
      <h2 class="text-xl mt-2">Guru Nanak Dev Engineering College, Ludhiana</h2>
      <p class="mt-1">Arpan Kaur Dhillon (2302480)</p>
      <p class="mt-1">4 Weeks Training from IIT Kanpur (Online)</p>
    </div>

    <!-- Daily Reports Section -->
    <h3 class="text-2xl font-bold text-gray-800 mt-10 mb-4">Daily Reports</h3>
    <div class="overflow-x-auto custom-scrollbar">
      <div id="calendar-strip" class="flex gap-3 pb-2"></div>
    </div>

    <!-- Extra Categories -->
    <h3 class="text-2xl font-bold text-gray-800 mt-10 mb-4">Other Documents</h3>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <button data-link="project.pdf" class="doc-btn bg-white p-6 rounded-xl shadow hover:shadow-lg flex flex-col items-center">
        <i class="ri-folder-line text-blue-600 text-4xl mb-2"></i>
        <span class="font-semibold">Projects</span>
      </button>
      <button data-link="mini project.pdf" class="doc-btn bg-white p-6 rounded-xl shadow hover:shadow-lg flex flex-col items-center">
        <i class="ri-code-box-line text-blue-600 text-4xl mb-2"></i>
        <span class="font-semibold">Mini Projects</span>
      </button>
      <button data-link="certificate.pdf" class="doc-btn bg-white p-6 rounded-xl shadow hover:shadow-lg flex flex-col items-center">
        <i class="ri-award-line text-blue-600 text-4xl mb-2"></i>
        <span class="font-semibold">Certificates</span>
      </button>
    </div>
  </div>

  <script>
    // Generate Day Buttons
    const calendarStrip = document.getElementById("calendar-strip");
    const totalDays = 22; // adjust to match your actual number of PDFs
    for (let i = 1; i <= totalDays; i++) {
      const btn = document.createElement("button");
      btn.className = "day-btn w-12 h-12 bg-white rounded-lg shadow hover:bg-blue-600 hover:text-white transition font-semibold";
      btn.textContent = i;
      btn.onclick = () => {
        window.open(`TR-102/files/day${i}.pdf`, "_blank");
      };
      calendarStrip.appendChild(btn);
    }

    // Category Buttons
    document.querySelectorAll(".doc-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const link = btn.dataset.link;
        window.open(`TR-102/files/${link}`, "_blank");
      });
    });
  </script>
</body>
</html>
